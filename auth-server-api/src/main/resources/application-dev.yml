# 公司内网环境
server:
  servlet:
    context-path: /open/after/v1
  port: 7081


spring:
  datasource:
    url: jdbc:mysql://localhost:3360/open_after?serverTimezone=CTT&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false
    username: root
    password: password
    driver-class-name: com.mysql.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    initialSize: 5
    minIdle: 5
    maxActive: 10
    maxWait: 60000
    timeBetweenEvictionRunsMillis: 60000
    minEvictableIdleTimeMillis: 300000
    validationQuery: SELECT 1 FROM DUAL
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true

    druid:
      filters: stat,wall
      initial-size: 20
      min-idle: 20
      max-active: 200
      max-wait: 30000
      time-between-eviction-runs-millis: 180000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      keep-alive: true
      max-pool-prepared-statement-per-connection-size: 50
      # true表示开启泄露检测堆栈日志，测试环境开启，pro环境需要关闭
      log-abandoned: true
      login:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        reset-enable: false
        login-username: aft_admin
        login-password: passwd
      web-stat-filter:
        enabled: false
        url-pattern: /*
        exclusions: /druid/*
      stat:
        #开启慢sql统计
        log-slow-sql: false
        #慢sql的时间
        slow-sql-millis: 3000
        merge-sql: true
        #开启druid datasource监控
        enabled: false
        wall:
          config:
          multi-statement-allow: true


  # redis
  redis:
    host: 127.0.0.1
    port: 6309
    database: 5
    timeout: 30000
    time: 36400
    password: passwd
    pool:
      max-idle: 100
      min-idle: 20


site:
  url: http://localhost:7081/


fdfs:
  connect-timeout: 600
  so-timeout: 1500
  pool:
    jmx-enabled: false
  thumb-image:
    width: 300
    height: 300
  tracker-list: 127.0.0.1:22122



base:
  defaultPassword: ekcSXaIx6Pk0tV3hkBfp6A==

access-control-allow-origin: "*"

